name: TeX Live integration
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: TeX Live on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4
        with:
          packages: scheme-basic
          cache: 'false'
      - name: Exercise package recovery and bibliography builds
        run: python tests/integration.py
